<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NZ Emergencys – Live Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="legend">
    <h3>NZ Emergencys</h3>
    <div><img src="icons/Alarm.PNG" /> Fire Call</div>
    <div><img src="icons/Green.PNG" /> Ambulance Call</div>
    <div><img src="icons/firestation.png" /> Fire Station</div>
    <div><img src="icons/ambostation.png" /> Ambulance Station</div>
    <div><img src="icons/Hydrant.png" /> Fire Hydrant</div>
    <small>Calls auto-remove after 7 days</small>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- LOAD CLEAN VERSION OF SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
